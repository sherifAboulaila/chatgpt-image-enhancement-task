<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960"><rect width="720" height="960" fill="#6b39e8"/><rect x="55" y="45" width="610" height="870" rx="4" fill="#fff"/><text x="360" y="125" text-anchor="middle" font-family="Arial" font-size="28" fill="#6334dc">مجموعة المرونة</text><text x="360" y="155" text-anchor="middle" font-family="Arial" font-size="18" fill="#ff6d59">الاتحاد من أجل المساواة</text><text x="360" y="260" text-anchor="middle" font-family="Arial" font-size="24" fill="#ff6d59">أنت مدعو إلى</text><text x="360" y="325" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="52" fill="#6334dc">فعالية رياضية</text><text x="360" y="390" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="52" fill="#6334dc">يوم التنس</text><text x="360" y="465" text-anchor="middle" font-family="Arial" font-size="22" fill="#ff6d59">انضم إلينا في بطولة التنس لجمع الأموال</text><text x="360" y="500" text-anchor="middle" font-family="Arial" font-size="22" fill="#ff6d59">لمجموعة المرونة لتقديم المساعدات بكل حب</text><rect x="55" y="565" width="610" height="300" fill="#c94c3e"/><line x1="120" y1="640" x2="580" y2="790" stroke="#222" stroke-width="26"/><line x1="150" y1="790" x2="590" y2="640" stroke="#222" stroke-width="26"/><text x="360" y="705" text-anchor="middle" font-family="Arial" font-size="22" fill="#fff">الموعد: 13 يونيو إلى 13 يوليو</text><text x="360" y="745" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff">9 ص إلى 1 م • كل أسبوع لمدة 4 أسابيع</text><text x="360" y="810" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff">المكان: ملعب تنس مجموعة المرونة</text></svg>